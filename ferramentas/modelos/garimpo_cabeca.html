<title>Garimpo de Canção</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: uma coluna de leitura; cada ponte é uma ficha que abre. A cor
   vermelha é rubricação — nos manuscritos árabes o vermelho marca estrutura,
   e aqui marca o estatuto epistêmico, que é a estrutura desta página. */
:root{
  --papel:#f3efe6; --papel2:#e9e3d6; --tinta:#221d16; --tinta2:#5d5346;
  --rubrica:#9c2b1f; --ouro:#8a6a22; --linha:#d6cdbb; --realce:#fdf8ea;
  --verde:#2f5d3f; --azul:#2c4a63;
  --disp:"Spectral",Georgia,"Times New Roman",serif;
  --corpo:"Spectral",Georgia,serif;
  --ar:"Amiri","Noto Naskh Arabic",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#17140f; --papel2:#1f1b15; --tinta:#eee7d8; --tinta2:#a89b86;
  --rubrica:#e07b64; --ouro:#d6ab4e; --linha:#342d22; --realce:#241f17;
  --verde:#7fb894; --azul:#89b4d0; color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#17140f; --papel2:#1f1b15; --tinta:#eee7d8; --tinta2:#a89b86;
  --rubrica:#e07b64; --ouro:#d6ab4e; --linha:#342d22; --realce:#241f17;
  --verde:#7fb894; --azul:#89b4d0; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:var(--corpo);font-size:17px;line-height:1.6;
  -webkit-text-size-adjust:100%}
.env{max-width:62rem;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
h1{font-family:var(--disp);font-weight:600;font-size:clamp(1.9rem,5vw,2.7rem);
  margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--tinta2);font-style:italic;margin:.35rem 0 0;max-width:46rem}
h2{font-family:var(--disp);font-weight:600;font-size:1.3rem;margin:0 0 .2rem;
  text-wrap:balance}
.eyebrow{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tinta2);margin:0 0 .5rem}
section{margin-top:40px}
hr.r{border:0;border-top:1px solid var(--linha);margin:34px 0 0}

/* números do corpus */
.nums{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.num{flex:1 1 8.5rem;min-width:0;background:var(--papel2);
  border:1px solid var(--linha);border-radius:3px;padding:11px 13px}
.num b{display:block;font-family:var(--mono);font-size:1.18rem;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.num span{display:block;font-size:.72rem;color:var(--tinta2);
  letter-spacing:.04em;text-transform:uppercase;margin-top:2px}

/* legenda de estatuto — rubricada */
.leg{display:grid;gap:9px;margin-top:14px}
.leg div{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start}
.badge{font-family:var(--mono);font-size:.64rem;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap;
  border:1px solid currentColor}
.b-fato{color:var(--verde)} .b-par{color:var(--azul)}
.b-acad{color:var(--ouro)} .b-cont{color:var(--rubrica);
  background:color-mix(in srgb,var(--rubrica) 12%,transparent)}
.b-aut{color:var(--tinta2)}
.leg p{margin:0;font-size:.9rem;color:var(--tinta2)}

/* tabela de medidas */
.tab{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:12px}
.tab th,.tab td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linha)}
.tab th{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta2);font-weight:500}
.tab td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.zero{color:var(--rubrica);font-weight:700}
.rolo{overflow-x:auto}

/* filtros */
.filtros{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chip{font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;
  text-transform:uppercase;padding:6px 10px;border:1px solid var(--linha);
  border-radius:2px;background:transparent;color:var(--tinta2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--papel);
  border-color:var(--tinta)}
.chip:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}

/* fichas de ponte */
.fichas{display:grid;gap:13px;margin-top:18px}
.ficha{border:1px solid var(--linha);border-radius:3px;background:var(--papel2);
  overflow:hidden}
.ficha.destaque{border-color:var(--rubrica)}
.cab{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;
  width:100%;text-align:left;background:transparent;border:0;cursor:pointer;
  padding:14px 15px;color:inherit;font:inherit}
.cab:focus-visible{outline:2px solid var(--ouro);outline-offset:-2px}
.ar{font-family:var(--ar);font-size:1.5rem;line-height:1.5;direction:rtl;
  color:var(--ouro);display:block}
.seta{font-size:.95rem;color:var(--tinta2);margin:0 .35rem}
.par{font-family:var(--disp);font-size:1.06rem;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:7px;font-size:.76rem;
  color:var(--tinta2);font-family:var(--mono)}
.dir{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.qtd{font-family:var(--mono);font-size:.8rem;font-variant-numeric:tabular-nums;
  color:var(--tinta2)}
.corpo{display:none;padding:0 15px 16px;border-top:1px solid var(--linha)}
.ficha[data-aberta="1"] .corpo{display:block}
.corpo h3{font-family:var(--disp);font-size:.78rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--tinta2);font-weight:500;margin:17px 0 5px}
.corpo p{margin:0 0 .5rem;max-width:44rem}
.nota{border-left:2px solid var(--rubrica);padding:9px 12px;background:var(--realce);
  font-size:.9rem;margin:10px 0}
.nota b{color:var(--rubrica)}
.termos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.termo{border:1px solid var(--linha);border-radius:2px;padding:4px 8px;
  font-size:.8rem;background:var(--papel)}
.termo i{font-family:var(--ar);font-size:1.1rem;font-style:normal;direction:rtl;
  color:var(--ouro)}
.termo s{text-decoration:none;color:var(--tinta2);font-size:.74rem;margin-inline-start:5px}
.copla{border-top:1px solid var(--linha);padding:11px 0 9px}
.copla .v{font-family:var(--ar);font-size:1.32rem;line-height:1.85;direction:rtl;
  text-align:right}
.copla .cred{font-family:var(--mono);font-size:.72rem;color:var(--tinta2);
  margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 11px}
.copla a{color:var(--ouro)}
.vazio{color:var(--tinta2);font-style:italic;font-size:.9rem}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--linha);
  font-size:.82rem;color:var(--tinta2)}
footer a{color:var(--ouro)}
@media (max-width:560px){
  .cab{grid-template-columns:1fr}
  .dir{align-items:flex-start}
  .ar{font-size:1.35rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
